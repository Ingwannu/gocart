[package]
name = "wicked-license"
version = "0.1.0"
edition = "2021"
description = "Wicked Shop license client for Rust Discord bots"

[dependencies]
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["pkcs8"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
